name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with an OIDC token instead of a secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake coverage
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          files: coverage/coverage.xml
          disable_search: true
          # The plugins look for gcov, xcrun and coverage.py data.
          plugins: noop
          use_oidc: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage
            !coverage/results
